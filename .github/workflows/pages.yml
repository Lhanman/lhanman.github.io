# 由 dispatch-pages 生成，不要手改。
# 仓库里的文档用中文路径存放，部署时按 catalog.json 复制成英文网址 p/<slug>/ 再上线。
# 需要在仓库 Settings → Pages → Source 选 GitHub Actions。
name: 部署文档站
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/build-site.py _site
      # upload-pages-artifact 会丢掉以点开头的目录，而 Tesla 公钥要放在 /.well-known/ 下，所以手动打包并上传
      # dispatch-pages 重新生成本文件时需保留这一段
      - run: tar --dereference --hard-dereference --directory _site -cvf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@v5
