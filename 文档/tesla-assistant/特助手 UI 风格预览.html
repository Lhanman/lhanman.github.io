<html lang="zh-CN">

<meta name="description" content="特助手已选定风格 A（新能源号牌）的移动端 UI 预览，含首页、车控、行程、日志四页，B、C 保留作对照，全部为演示数据。">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<style>
:root {
  --page-bg: #eceef0; --page-ink: #14181c; --page-muted: #4a545e; --page-line: #cdd3d9; --page-surface: #ffffff; --page-accent: #14181c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #101316; --page-ink: #eef1f4; --page-muted: #a2adb8; --page-line: #2a3138; --page-surface: #181c20; --page-accent: #eef1f4; color-scheme: dark; }
}
:root[data-theme="dark"] { color-scheme: dark; --page-bg: #101316; --page-ink: #eef1f4; --page-muted: #a2adb8; --page-line: #2a3138; --page-surface: #181c20; --page-accent: #eef1f4; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--page-bg); color: var(--page-ink); font: 15px/1.55 -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
.wrap { max-width: 1480px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: 0; }
.sub { color: var(--page-muted); margin: 0 0 20px; max-width: 70ch; }
.switch { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.switch button { font: inherit; color: var(--page-ink); background: var(--page-surface); border: 1px solid var(--page-line); border-radius: 10px; padding: 10px 16px; cursor: pointer; min-height: 44px; }
.switch button[aria-pressed="true"] { background: var(--page-ink); color: var(--page-bg); border-color: var(--page-ink); }
.switch button:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
.about { background: var(--page-surface); border: 1px solid var(--page-line); border-radius: 12px; padding: 14px 16px; margin-bottom: 24px; display: grid; gap: 6px 24px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.about b { display: block; font-size: 12px; color: var(--page-muted); font-weight: 600; margin-bottom: 2px; }
.about p { margin: 0; }
.phones { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(358px, 100%), 1fr)); gap: 28px 20px; justify-items: center; }
.cell figcaption { text-align: center; color: var(--page-muted); font-size: 13px; margin-top: 10px; }
.cell { margin: 0; }
.phone { width: min(358px, 100%); height: 744px; border-radius: 40px; background: #0b0d0f; padding: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.22); }
.screen { width: 100%; height: 100%; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); position: relative; }
.sbar { display: flex; justify-content: space-between; padding: 12px 22px 4px; font-size: 13px; font-weight: 600; flex: none; }
.body { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--tabbg); padding: 6px 4px 14px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 6px 0; border-radius: 10px; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--tabon); font-weight: 700; }
.ttl { font-size: 20px; font-weight: 700; margin: 4px 0 0; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.demo { font-size: 11px; color: var(--muted); text-align: center; padding: 2px 0 0; }

/* shared parts */
.rows { display: grid; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 48px; }
.row:last-child { border-bottom: 0; }
.row .k { flex: 1; }
.row .v { font-weight: 600; text-align: right; }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: var(--r); background: var(--warnbg); color: var(--warnink); }
.alert b { display: block; }
.alert span { font-size: 13px; }
.btn { font: inherit; font-weight: 700; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: var(--r); background: var(--act); color: var(--actink); }
.btn.ghost { background: transparent; color: var(--act); box-shadow: inset 0 0 0 1.5px var(--act); }
.btn.off { background: var(--offbg); color: var(--offink); box-shadow: none; cursor: default; }
.btn:focus-visible, .stepper button:focus-visible { outline: 3px solid var(--act); outline-offset: 2px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.box { background: var(--surface); border-radius: var(--r); padding: 12px 14px; }
.box h3 { margin: 0 0 6px; font-size: 14px; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border-radius: var(--r); border: 0; font: inherit; font-size: 22px; background: var(--offbg); color: var(--act); cursor: pointer; }
.stepper .val { min-width: 64px; text-align: center; font-weight: 700; font-size: 18px; }
.switchbtn { width: 56px; height: 32px; border-radius: 16px; background: var(--offbg); position: relative; flex: none; }
.switchbtn::after { content: ""; position: absolute; left: 4px; top: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.busy { display: grid; gap: 6px; }
.busy .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; position: relative; }
.busy .bar::after { content: ""; position: absolute; inset: 0 auto 0 -40%; width: 40%; background: var(--act); animation: slide 1.4s cubic-bezier(.22,1,.36,1) infinite; }
@keyframes slide { to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .busy .bar::after { animation: none; left: 0; width: 60%; } }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; }
.ok { color: var(--okink); } .bad { color: var(--badink); } .warn { color: var(--warnink); }
.log { display: grid; }
.log .e { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.log .e:last-child { border-bottom: 0; }
.log .t { font-size: 12px; color: var(--muted); }
.log .n { font-weight: 600; }
.log small { display: block; color: var(--muted); font-size: 12px; }
.trip { padding: 12px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.trip:last-child { border-bottom: 0; }
.trip .h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.trip .h b { font-size: 16px; }
.delta { font-weight: 700; }
.bars { display: grid; gap: 4px; }
.bars i { display: block; height: 8px; border-radius: 4px; }
.bars .p { background: var(--barp); } .bars .a { background: var(--bara); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend .lp::before { background: var(--barp); } .legend .la::before { background: var(--bara); }

/* ===== A 号牌 ===== */
[data-style="a"] { --bg:#f3f6f0; --surface:#ffffff; --ink:#0c1f15; --muted:#445a4d; --line:#d3dcd5; --tabbg:#ffffff; --tabon:#0a6a3a; --r:8px;
  --act:#0a7a41; --actink:#ffffff; --offbg:#e4eae6; --offink:#51655a; --warnbg:#fff3df; --warnink:#8a4b00; --okink:#0a6a3a; --badink:#b0271c; --barp:#9bb3a4; --bara:#0a7a41; }
.plate { position: relative; border-radius: 14px; height: 224px; padding: 14px; color: #0a1d13; overflow: hidden;
  background: linear-gradient(to top, #1c8b4d 0%, #73cc86 var(--lvl), #1f2d25 var(--lvl), #1f2d25 calc(var(--lvl) + 1px), #eef4e6 calc(var(--lvl) + 1px), #f7faf1 100%); box-shadow: inset 0 0 0 2px #0a1d13; }
.plate::before { content: ""; position: absolute; inset: 7px; border-radius: 8px; box-shadow: inset 0 0 0 1.5px rgba(10,29,19,.55); pointer-events: none; }
.plate .top { position: relative; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
.plate .chip { background: #0a1d13; color: #eaf7ee; border-radius: 6px; padding: 2px 10px; font-size: 12px; }
.plate .big { position: absolute; left: 0; right: 0; top: 50px; text-align: center; font-size: 72px; font-weight: 800; line-height: 1; letter-spacing: .04em; }
.plate .big small { font-size: 26px; letter-spacing: 0; margin-left: 2px; }
.plate .rng { position: absolute; left: 0; right: 0; bottom: 18px; text-align: center; font-weight: 700; font-size: 15px; }
.plate .tick { position: absolute; right: 12px; font-size: 10px; font-weight: 700; color: #0a1d13; }
[data-style="a"] .box, [data-style="a"] .rows { background: var(--surface); border-radius: var(--r); }
[data-style="a"] .rows { padding: 0 14px; }
[data-style="a"] .btn { letter-spacing: .02em; }

/* ===== B 暖卡片 ===== */
[data-style="b"] { --bg:#f6efe5; --surface:#ffffff; --ink:#2b2420; --muted:#6a5d52; --line:#eadfd1; --tabbg:#ffffff; --tabon:#4338ca; --r:18px;
  --act:#4338ca; --actink:#ffffff; --offbg:#efe6d9; --offink:#74675b; --warnbg:#ffe9d6; --warnink:#8a3d00; --okink:#1d7a45; --badink:#b42318; --barp:#d8c8b3; --bara:#4338ca; }
[data-style="b"] .screen { font-family: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; }
[data-style="b"] .box, [data-style="b"] .rows, [data-style="b"] .card { background: var(--surface); border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
[data-style="b"] .rows { padding: 4px 16px; }
[data-style="b"] .box { padding: 14px 16px; }
[data-style="b"] .hero { background: var(--surface); border-radius: 26px; padding: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.1); display: grid; gap: 10px; }
[data-style="b"] .hero .big { font-size: 56px; font-weight: 800; line-height: 1; }
[data-style="b"] .hero .meter { height: 14px; border-radius: 7px; background: var(--offbg); overflow: hidden; }
[data-style="b"] .hero .meter i { display: block; height: 100%; width: var(--lvl); border-radius: 7px; background: #2f9e5e; }
[data-style="b"] .btn { border-radius: 16px; }
[data-style="b"] .tabs { border-top: 0; box-shadow: 0 -6px 18px rgba(0,0,0,.06); }
[data-style="b"] .tab[aria-current="page"] { background: #eceafc; }
[data-style="b"] .row { border-bottom-color: var(--line); }

/* ===== C 夜线图 ===== */
[data-style="c"] { --bg:#0a1330; --surface:#122046; --ink:#eef2ff; --muted:#aab7df; --line:#25356a; --tabbg:#0d1838; --tabon:#ffffff; --r:10px;
  --act:#2a62f0; --actink:#ffffff; --offbg:#1d2c58; --offink:#9aa9d6; --warnbg:#3a2a08; --warnink:#ffcf6b; --okink:#4fd49a; --badink:#ff8a80; --barp:#6b7bb0; --bara:#f2b01e;
  --l1:#e8413c; --l2:#3d7bff; --l3:#f2b01e; --l4:#22b573; }
[data-style="c"] .btn.ghost { color: #bcd0ff; box-shadow: inset 0 0 0 1.5px #3d7bff; }
[data-style="c"] .tab[aria-current="page"] svg { color: #fff; }
[data-style="c"] .tab[aria-current="page"]::after { content: ""; width: 22px; height: 3px; border-radius: 2px; background: var(--l2); margin-top: 2px; }
[data-style="c"] .board { display: grid; gap: 2px; background: var(--surface); border-radius: var(--r); padding: 6px 14px; }
.line-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line-row:last-child { border-bottom: 0; }
.badge { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; color: #0a1330; background: var(--lc); }
.track { position: relative; height: 22px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 4px; border-radius: 2px; background: rgba(238,242,255,.18); }
.track .on { position: absolute; left: 0; top: 10px; height: 4px; border-radius: 2px; background: var(--lc); width: var(--w); }
.track .st { position: absolute; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: #0a1330; border: 3px solid #eef2ff; transform: translateX(-50%); }
.track .st.now { width: 20px; height: 20px; top: 2px; border-color: var(--lc); background: #eef2ff; }
.track .st.stop { background: #e8413c; border-color: #eef2ff; }
.line-row .name { font-weight: 700; }
.line-row .sub { font-size: 12px; color: var(--muted); }
.line-row .state { font-size: 12px; font-weight: 700; text-align: right; }
.tl { position: relative; height: 66px; margin: 4px 4px 0; }
.tl::before { content: ""; position: absolute; left: 0; right: 0; top: 29px; height: 5px; border-radius: 3px; background: var(--l2); }
.tl .p, .tl .a { position: absolute; transform: translateX(-50%); text-align: center; font-size: 11px; font-weight: 700; white-space: nowrap; line-height: 14px; }
.tl .p { top: 0; } .tl .a { top: 50px; }
.tl .dot { position: absolute; top: 24px; width: 15px; height: 15px; border-radius: 50%; transform: translateX(-50%); background: #0a1330; border: 3px solid #eef2ff; }
.tl .dot.act { width: 21px; height: 21px; top: 21px; background: #eef2ff; border-color: var(--lc2); }
.tl .gap { position: absolute; top: 27px; height: 9px; background: var(--lc2); border-radius: 2px; opacity: .9; }
.chosen { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--page-surface); border: 1px solid var(--page-line); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.chosen b { color: #0a6a3a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chosen b { color: #6fd39a; } }
:root[data-theme="dark"] .chosen b { color: #6fd39a; }
</style>

<div class="wrap">
  <h1>特助手 · UI 风格预览</h1>
  <p class="sub">三种风格方向，每种展示首页、车控、行程、日志四页。页面里的车名、电量、行程、日志全部是编造的示例数据，不是任何真实车辆的信息。两端（iOS、Android）统一品牌风格，这里按手机竖屏呈现。</p>
  <p class="chosen"><b>已选定：A · 新能源号牌</b><span class="sub" style="margin:0">B、C 保留作对照。</span></p>
  <div class="switch" role="group" aria-label="风格方向">
    <button type="button" data-pick="a" aria-pressed="true">A · 新能源号牌</button>
    <button type="button" data-pick="b" aria-pressed="false">B · 暖卡片</button>
    <button type="button" data-pick="c" aria-pressed="false">C · 夜线图</button>
  </div>
  <div class="about" id="about"></div>
  <div class="phones" id="phones"></div>
</div>

<script>
const D = {
  car: "我的车", online: "在线 · 2 分钟前", battery: 62, rangeKm: 180, limit: 90,
  trips: [
    { dest: "公司", pred: 25, act: 31, when: "今天 08:12" },
    { dest: "家", pred: 40, act: 38, when: "昨天 18:40" },
    { dest: "健身房", pred: 12, act: 12, when: "周五 19:05" },
    { dest: "机场", pred: 55, act: 63, when: "周三 06:30" }
  ],
  logs: [
    { s: "ok", n: "开启空调 21°", d: "iPhone · 先唤醒车辆，用时 14 秒", t: "14:20" },
    { s: "ok", n: "闪灯", d: "Pixel · 车辆在线", t: "12:03" },
    { s: "bad", n: "设置充电上限 80%", d: "失败：车辆离线，唤醒超时", t: "昨天 22:41" },
    { s: "deny", n: "开锁", d: "已拒绝：远程不允许，请在本机终端操作", t: "昨天 18:02" },
    { s: "ok", n: "关闭空调", d: "iPhone · 车辆在线", t: "昨天 08:50" }
  ]
};
const ABOUT = {
  a: [["主张", "电量就是号牌的渐变：绿色自下而上填到电量高度，不画电池图标和圆环。"], ["配色与形", "白瓷底，墨绿近黑的字，深牌绿只给能点的东西；圆角小而硬朗。"], ["签名手势", "首页的号牌牌面：填充高度 = 电量。"], ["风险", "牌面是识别度来源，但它占首屏很大面积；国行绿牌的联想只对认得它的人成立。"]],
  b: [["主张", "最像日常 App：暖底白卡，一张卡一件事，亮色只出现在能点的地方。"], ["配色与形", "暖沙底，白卡大圆角，靛蓝只给可操作的元素，不能点则褪成灰褐。"], ["签名手势", "按压时的轻微弹性，和永远够得到的底部栏。"], ["风险", "最安全也最不独特，看起来像很多消费 App；对车和行程的个性表达少。"]],
  c: [["主张", "车的状态像一张线路状态板：每项一条线，站点就是刻度，延迟和暂停一眼可见。"], ["配色与形", "午夜蓝底，白色站点，红蓝黄绿四色线只用来表达状态。"], ["签名手势", "行程页：预计到达和实际到达是同一条线上两个站，偏差就是两站间距。"], ["风险", "深色在夜里舒服，强光下对比要靠亮度撑；线路图的联想偏地铁，要避免显得像交通 App。"]]
};
const I = n => `<svg class="ico" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const tabs = (cur) => `<nav class="tabs" aria-label="主导航">${[["home","home","首页"],["ctl","ctl","车控"],["route","route","行程"],["list","list","日志"]].map(([k,i,l]) => `<div class="tab" ${k===cur?'aria-current="page"':''}><svg class="ico" style="width:24px;height:24px" aria-hidden="true"><use href="#i-${i}"/></svg>${l}</div>`).join("")}</nav>`;
const delta = t => { const d = t.act - t.pred; return d > 0 ? `+${d} 分` : d < 0 ? `−${-d} 分` : "准时"; };
const max = Math.max(...D.trips.map(t => Math.max(t.pred, t.act)));

function homeHero(st) {
  if (st === "a") return `<div class="plate" style="--lvl:${D.battery}%"><div class="top"><span>${D.car}</span><span class="chip">${D.online}</span></div><div class="big num">${D.battery}<small>%</small></div><div class="rng num">续航约 ${D.rangeKm} km · 未连接充电</div></div>`;
  if (st === "b") return `<div class="hero" style="--lvl:${D.battery}%"><div style="display:flex;justify-content:space-between;align-items:center"><b>${D.car}</b><span class="pill ok" style="background:#e3f5ea">${D.online}</span></div><div class="big num">${D.battery}%</div><div class="meter" role="img" aria-label="电量 ${D.battery}%"><i></i></div><div class="muted num">续航约 ${D.rangeKm} km · 未连接充电，上限 ${D.limit}%</div></div>`;
  const rows = [
    ["#22b573", "电", "电量线", `约 ${D.rangeKm} km`, 62, "正常", "ok", [0, 25, 50, 75, 100]],
    ["#f2b01e", "门", "门窗锁线", "已锁 · 左后车窗未关", 70, "延迟", "warn", [0, 33, 66, 100]],
    ["#3d7bff", "空", "空调线", "车内 30° · 车外 30°", 0, "关闭", "", [0, 50, 100]],
    ["#e8413c", "充", "充电线", `未连接 · 上限 ${D.limit}%`, 0, "暂停", "bad", [0, 50, 100]]
  ];
  return `<div class="board" role="list">${rows.map(([c, b, n, s, w, state, cls, stops]) => `<div class="line-row" role="listitem" style="--lc:${c}"><div class="badge" aria-hidden="true">${b}</div><div><div class="name">${n}</div><div class="sub">${s}</div><div class="track" aria-hidden="true"><i class="on" style="--w:${w}%"></i>${stops.map(p => `<i class="st${(w && p === stops.reduce((m, q) => Math.abs(q - w) < Math.abs(m - w) ? q : m)) ? " now" : ""}" style="left:${p}%"></i>`).join("")}</div></div><div class="state ${cls}">${state}</div></div>`).join("")}</div>`;
}
function home(st) {
  const warn = `<div class="alert" role="status">${I("warn")}<div><b>左后车窗未关</b><span>车窗需要在车上关闭，手机上不提供远程关窗。</span></div></div>`;
  const rows = `<div class="rows">
    <div class="row">${I("lock")}<span class="k">车锁</span><span class="v">已锁</span></div>
    <div class="row">${I("warn")}<span class="k">门窗</span><span class="v warn">左后车窗未关</span></div>
    <div class="row">${I("snow")}<span class="k">空调</span><span class="v">关闭</span></div>
    <div class="row">${I("clock")}<span class="k">车内 / 车外</span><span class="v num">30° / 30°</span></div>
    <div class="row">${I("bolt")}<span class="k">充电</span><span class="v">未连接</span></div></div>`;
  return st === "c" ? homeHero(st) + warn : homeHero(st) + warn + rows;
}
function control(st) {
  return `
  <h2 class="ttl">车控</h2>
  <div class="box" style="display:grid;gap:10px"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3 style="margin:0">出门模式</h3><span class="muted" style="font-size:13px">开空调 21° · 读电量</span></div></div><button class="btn" type="button">${I("play")}一键开始</button></div>
  <div class="box busy"><div style="display:flex;align-items:center;gap:12px">${I("snow")}<div style="flex:1"><b>空调</b><div class="muted" style="font-size:13px">正在唤醒车辆… <span class="num">12</span> 秒</div></div><div class="switchbtn" role="switch" aria-checked="false" aria-label="空调开关"></div></div><div class="bar" role="progressbar" aria-label="正在唤醒"></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">目标温度</span><div class="stepper"><button type="button" aria-label="降低">−</button><span class="val num">21°</span><button type="button" aria-label="升高">+</button></div></div></div>
  <div class="grid2">
    <button class="btn off" type="button" aria-disabled="true">${I("lock")}已锁车</button>
    <button class="btn ghost" type="button">${I("bulb")}闪灯</button>
    <button class="btn ghost" type="button">${I("horn")}鸣笛</button>
    <button class="btn ghost" type="button">${I("bolt")}暂停充电</button></div>
  <div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3 style="margin:0">充电上限</h3><span class="muted" style="font-size:13px">日常建议 80%–90%</span></div><div class="stepper"><button type="button" aria-label="降低">−</button><span class="val num">${D.limit}%</span><button type="button" aria-label="升高">+</button></div></div></div>
  <p class="muted" style="font-size:12px;margin:0">开锁、后备箱、车窗等高风险操作不在手机上提供。车休眠时控车会先唤醒，最长约 60 秒。</p>`;
}
function tripViz(st, t) {
  if (st !== "c") return `<div class="bars" aria-hidden="true"><i class="p" style="width:${t.pred / max * 100}%"></i><i class="a" style="width:${t.act / max * 100}%"></i></div>`;
  const pp = t.pred / max * 86 + 6, aa = t.act / max * 86 + 6, lo = Math.min(pp, aa), hi = Math.max(pp, aa);
  const worse = t.act > t.pred, col = t.act === t.pred ? "#22b573" : worse ? "#e8413c" : "#f2b01e";
  return `<div class="tl" style="--lc2:${col}" aria-hidden="true"><i class="gap" style="left:${lo}%;width:${hi - lo}%"></i><span class="p" style="left:${pp}%">预计 ${t.pred} 分</span><i class="dot" style="left:${pp}%"></i><i class="dot act" style="left:${aa}%"></i><span class="a" style="left:${aa}%">实际 ${t.act} 分</span></div>`;
}
function trips(st) {
  const list = D.trips.map(t => `<div class="trip"><div class="h"><b>${t.dest}</b><span class="delta num ${t.act > t.pred ? 'bad' : t.act < t.pred ? 'warn' : 'ok'}">${delta(t)}</span></div><div class="muted num" style="font-size:12px">${t.when} · 车机预计 ${t.pred} 分钟 · 实际 ${t.act} 分钟</div>${tripViz(st, t)}</div>`).join("");
  return `<h2 class="ttl">行程</h2>
  <div class="box"><h3>近 4 次平均偏差</h3><div style="font-size:30px;font-weight:800" class="num">+4 分钟</div><div class="muted" style="font-size:13px">车机预计普遍偏快；示例数据</div></div>
  <div class="alert" style="background:var(--surface);color:var(--ink)" role="status">${I("route")}<div><b>进行中：超市</b><span class="muted num">预计还有 11 分钟，已行驶 7 分钟</span></div></div>
  <div class="box"><div class="legend"><span class="lp">车机预计</span><span class="la">实际用时</span></div>${list}</div>`;
}
function log(st) {
  const icon = { ok: ["check", "ok", "成功"], bad: ["x", "bad", "失败"], deny: ["ban", "warn", "已拒绝"] };
  return `<h2 class="ttl">日志</h2><div class="box"><div class="log">${D.logs.map(l => { const [ic, cls, w] = icon[l.s]; return `<div class="e"><span class="${cls}">${I(ic)}</span><div><div class="n">${l.n} <span class="${cls}" style="font-size:12px">${w}</span></div><small>${l.d}</small></div><span class="t num">${l.t}</span></div>`; }).join("")}</div></div>
  <p class="muted" style="font-size:12px;margin:0">每条控车都会记录，包含被拒绝的。</p>`;
}
const PAGES = [["home", "首页", home, "home"], ["ctl", "车控", control, "ctl"], ["route", "行程", trips, "route"], ["list", "日志", log, "list"]];
function render(st) {
  document.getElementById("phones").innerHTML = PAGES.map(([k, label, fn]) => `<figure class="cell"><div class="phone"><div class="screen" data-style="${st}"><div class="sbar"><span class="num">9:41</span><span>示例</span></div><div class="body">${k === "home" ? `<h2 class="ttl" style="margin-bottom:0">${D.car}</h2>` : ""}${fn(st)}<div class="demo">演示数据</div></div>${tabs(k)}</div></div><figcaption>${label}</figcaption></figure>`).join("");
  document.getElementById("about").innerHTML = ABOUT[st].map(([h, p]) => `<div><b>${h}</b><p>${p}</p></div>`).join("");
  document.querySelectorAll("[data-pick]").forEach(b => b.setAttribute("aria-pressed", b.dataset.pick === st));
  try { localStorage.setItem("ui-style", st); } catch (e) {}
}
document.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => render(b.dataset.pick)));
let start = "a";
try { const s = localStorage.getItem("ui-style"); if (s && ABOUT[s]) start = s; } catch (e) {}
const q = new URLSearchParams(location.search).get("style"); if (q && ABOUT[q]) start = q;
render(start);
</script>
</body>
</html>
