<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<style>
:root {
  --page-bg: #e4e4df; --page-ink: #17191c; --page-muted: #565b62; --page-line: #c9c9c2; --page-surface: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page-bg: #0a0b0c; --page-ink: #f2f2ef; --page-muted: #a3a7ad; --page-line: #2a2d31; --page-surface: #17191c; color-scheme: dark; }
}
:root[data-theme="dark"] { --page-bg: #0a0b0c; --page-ink: #f2f2ef; --page-muted: #a3a7ad; --page-line: #2a2d31; --page-surface: #17191c; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--page-bg); color: var(--page-ink); font: 15px/1.55 -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1760px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
.sub { color: var(--page-muted); margin: 0 0 18px; max-width: 72ch; }
.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.seg { display: inline-flex; background: rgba(120,120,128,.18); border-radius: 10px; padding: 2px; }
.seg button { font: inherit; font-size: 14px; font-weight: 500; color: var(--page-ink); background: transparent; border: 0; border-radius: 8px; padding: 0 16px; min-height: 44px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--page-surface); box-shadow: 0 1px 4px rgba(0,0,0,.18); font-weight: 600; }
.seg button:focus-visible { outline: 3px solid #f5a300; outline-offset: 1px; }
.notes { display: grid; gap: 4px 28px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); margin-bottom: 28px; max-width: 1100px; }
.notes p { margin: 0; color: var(--page-muted); }
.notes b { color: var(--page-ink); font-weight: 600; }
.phones { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(390px, 100%), 1fr)); gap: 32px 20px; justify-items: center; }
.cell { margin: 0; width: 100%; display: flex; flex-direction: column; align-items: center; }
.cell figcaption { color: var(--page-muted); font-size: 13px; margin-top: 10px; }
.phone { width: min(390px, 100%); height: 820px; border-radius: 48px; background: #08090a; padding: 9px; box-shadow: 0 0 0 1.5px #34373b, 0 18px 40px rgba(0,0,0,.28); position: relative; }

/* ===== app tokens：仪表刻度 ===== */
.screen { --bg:#efefec; --card:#ffffff; --card2:#f5f5f2; --ink:#15171a; --ink2:#595e65; --ink3:#a3a7ac; --line:#e2e2dd;
  --amber:#f5a300; --amber-t:#8a5300; --on-amber:#15171a; --ok:#1e8e5a; --bad:#d93f2e; --tabbg:rgba(239,239,236,.84); --tick-off:#d9d9d4;
  position: relative; width: 100%; height: 100%; border-radius: 40px; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif; font-size: 16px; line-height: 1.35; }
.screen[data-scheme="dark"] { --bg:#0d0e10; --card:#17191c; --card2:#1f2226; --ink:#f2f2ef; --ink2:#a7abb1; --ink3:#6b7076; --line:#2a2d31;
  --amber:#ffb224; --amber-t:#ffc85a; --on-amber:#15171a; --ok:#3dd68c; --bad:#ff6b5c; --tabbg:rgba(13,14,16,.82); --tick-off:#2d3035; }
.n { font-family: "Barlow Semi Condensed", "DIN Alternate", "Roboto Condensed", "PingFang SC", system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: 0; }

.sb { position: absolute; z-index: 4; top: 0; left: 0; right: 0; height: 46px; display: flex; justify-content: space-between; align-items: center; padding: 8px 28px 0; font-weight: 600; font-size: 15px; }
.sb .r { display: flex; gap: 6px; align-items: center; }
.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 50px 16px 104px; scrollbar-width: none; display: flex; flex-direction: column; gap: 12px; }
.scroll::-webkit-scrollbar { display: none; }
.ttl { margin: 6px 4px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ttl h2 { margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: .01em; }
.stat { font-size: 13px; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; }
.stat i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.card { background: var(--card); border-radius: 18px; padding: 16px; }
.lab { font-size: 12px; color: var(--ink2); letter-spacing: .06em; margin: 8px 4px -4px; }
.foot { font-size: 12.5px; line-height: 18px; color: var(--ink2); margin: -4px 6px 0; }
.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 刻度 */
.scale { position: relative; height: 40px; }
.ticks { display: flex; justify-content: space-between; align-items: flex-end; height: 22px; position: absolute; left: 0; right: 0; top: 0; }
.ticks i { width: 3px; height: 22px; border-radius: 1.5px; background: var(--tick-off); }
.ticks i.on { background: var(--amber); }
.ticks i.m { height: 22px; }
.lim { position: absolute; top: 24px; width: 0; height: 0; transform: translateX(-50%); border-left: 5px solid transparent; border-right: 5px solid transparent; border-bottom: 7px solid var(--ink); }
.limt { position: absolute; top: 26px; transform: translateX(-50%); font-size: 11px; color: var(--ink2); white-space: nowrap; padding-top: 7px; }
.big { font-size: 64px; line-height: 60px; font-weight: 600; }
.big small { font-size: 26px; font-weight: 500; color: var(--ink2); margin-left: 3px; }

/* 车示意图 */
.car { display: block; margin: 0 auto; max-width: 100%; height: auto; }

/* 行 */
.rows > div { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 6px 0; border-top: 1px solid var(--line); }
.rows > div:first-child { border-top: 0; }
.rows .k { flex: 1; min-width: 0; }
.rows .k small { display: block; color: var(--ink2); font-size: 12.5px; line-height: 17px; }
.rows .v { color: var(--ink2); text-align: right; white-space: nowrap; }
.rows svg.ico { width: 22px; height: 22px; color: var(--ink2); flex: none; }
.bad { color: var(--bad); } .ok { color: var(--ok); }

.btn { font: inherit; font-weight: 600; font-size: 16px; border: 0; cursor: pointer; border-radius: 14px; min-height: 48px; padding: 0 18px; background: var(--amber); color: var(--on-amber); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 14px; border-radius: 10px; position: relative; background: var(--card2); color: var(--ink); }
.btn.sm::after { content: ""; position: absolute; inset: -4px -4px; }
.btn:focus-visible, .rd button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.btn svg { width: 20px; height: 20px; }
.dial { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 2px; }
.dial .t { font-size: 76px; line-height: 70px; font-weight: 600; text-align: center; }
.dial .t sup { font-size: 30px; font-weight: 500; color: var(--ink2); vertical-align: top; margin-left: 2px; line-height: 40px; }
.rd { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--card2); color: var(--ink); font-size: 26px; line-height: 1; cursor: pointer; }
.wait { height: 3px; border-radius: 2px; background: var(--card2); position: relative; overflow: hidden; margin-top: 12px; }
.wait::after { content: ""; position: absolute; inset: 0 auto 0 -30%; width: 30%; background: var(--amber); animation: go 1.3s cubic-bezier(.4,0,.2,1) infinite; }
@keyframes go { to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .wait::after { animation: none; left: 0; width: 55%; } }
.sw { width: 50px; height: 30px; border-radius: 15px; background: var(--card2); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink3); }
.rng { position: absolute; inset: -8px 0 -8px; width: 100%; height: 56px; opacity: 0; margin: 0; cursor: pointer; }
.seg2 { display: flex; background: var(--card); border-radius: 12px; padding: 3px; }
.seg2 span { flex: 1; text-align: center; font-size: 13px; font-weight: 500; padding: 8px 0; border-radius: 9px; color: var(--ink2); }
.seg2 span.on { background: var(--card2); color: var(--ink); font-weight: 600; }
.tl { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.tl:first-child { border-top: 0; }
.tl .tm { font-size: 17px; color: var(--ink2); padding-top: 1px; }
.tl b { font-weight: 600; } .tl small { display: block; color: var(--ink2); font-size: 12.5px; line-height: 17px; }
.tl .st { font-size: 13px; font-weight: 600; padding-top: 3px; text-align: right; }
.trip { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.trip:first-child { border-top: 0; }
.trip small { display: block; color: var(--ink2); font-size: 12.5px; line-height: 17px; }
.trip .dv { font-size: 28px; font-weight: 600; text-align: right; white-space: nowrap; }
.trip .dv small { display: inline; font-size: 13px; font-weight: 500; font-family: -apple-system, "PingFang SC", sans-serif; margin-left: 2px; }

.tabs { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; padding: 6px 8px 22px; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--tabbg); backdrop-filter: saturate(160%) blur(20px); -webkit-backdrop-filter: saturate(160%) blur(20px); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink2); font-size: 11px; font-weight: 500; min-height: 50px; justify-content: center; position: relative; }
.tab svg { width: 25px; height: 25px; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -6px; width: 22px; height: 3px; border-radius: 0 0 3px 3px; background: var(--amber); }
.ex { text-align: center; font-size: 12px; color: var(--ink3); margin: 6px 0 0; }

.st3d { position: relative; height: 304px; border-radius: 18px; overflow: hidden; background: radial-gradient(ellipse 80% 70% at 50% 72%, var(--card2) 0%, var(--card) 72%); }
.winlabel { position: absolute; pointer-events: none; opacity: 0; transition: opacity .2s; }
.winlabel i { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 5px color-mix(in srgb, var(--bad) 28%, transparent); }
.winlabel span { position: absolute; left: 14px; top: -34px; white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--bad); background: var(--card); border: 1px solid var(--bad); padding: 2px 8px; border-radius: 8px; }
.lockchip { position: absolute; left: 14px; top: 14px; display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--ok); }
.lockchip svg { width: 16px; height: 16px; }
.hint { position: absolute; right: 14px; top: 14px; font-size: 12px; color: var(--ink3); }
.paints { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 14px; justify-content: center; }
.paints button { width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; position: relative; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 0 0 2px var(--card); }
.paints button::after { content: ""; position: absolute; inset: -10px; }
.paints button[aria-pressed="true"] { box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 0 0 2px var(--card), 0 0 0 4px var(--amber); }
.paints button:focus-visible { outline: 3px solid var(--amber); outline-offset: 4px; }
</style>

<div class="wrap">
  <h1>特助手 UI 预览</h1>
  <p class="sub">这一版从产品本身出发：特助手做的事是"量"和"状态"，所以所有数值（电量、充电上限、温度、行程偏差）都用同一种刻度语言表达，首页主角是车的俯视示意图。页面里的车名、数值、行程、日志都是编造的示例数据。</p>
  <div class="bar">
    <div class="seg" role="group" aria-label="外观"><button type="button" data-scheme="light" aria-pressed="true">浅色</button><button type="button" data-scheme="dark" aria-pressed="false">深色</button></div>
  </div>
  <div class="notes">
    <p><b>车就是界面</b>　首页不堆统计，而是画一张车的俯视图：哪扇窗没关、锁没锁，直接画在车上。</p>
    <p><b>一把尺量所有</b>　电量是一排刻度，充电上限是刻度上的标记，行程偏差是同一种尺上的点。</p>
    <p><b>琥珀是仪表背光</b>　唯一的品牌色，只给能点的和选中的；异常用珊瑚红、正常用绿，并且总带文字。</p>
  </div>
  <div class="phones" id="phones"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
const D = {
  car: "我的车", battery: 62, rangeKm: 180, limit: 90,
  trips: [
    { dest: "公司", pred: 25, act: 31, when: "今天 08:12" },
    { dest: "家", pred: 40, act: 38, when: "昨天 18:40" },
    { dest: "健身房", pred: 12, act: 12, when: "周五 19:05" },
    { dest: "机场", pred: 55, act: 63, when: "周三 06:30" }
  ],
  logs: [
    { tm: "14:20", ok: "ok", n: "开启空调 21°", d: "iPhone · 先唤醒车辆，用时 14 秒", w: "成功" },
    { tm: "12:03", ok: "ok", n: "闪灯", d: "Pixel · 车辆在线", w: "成功" },
    { tm: "昨 22:41", ok: "bad", n: "设置充电上限 80%", d: "车辆离线，唤醒超时", w: "失败" },
    { tm: "昨 18:02", ok: "deny", n: "开锁", d: "远程不允许，请在本机终端操作", w: "已拒绝" },
    { tm: "昨 08:50", ok: "ok", n: "关闭空调", d: "iPhone · 车辆在线", w: "成功" }
  ]
};
const N = 25;
const I = (n, st = "") => `<svg class="ico" ${st ? `style="${st}"` : ""} aria-hidden="true" viewBox="0 0 24 24"><use href="#i-${n}"/></svg>`;

function scale(level, limit, id) {
  const on = Math.round(level / 100 * N);
  return `<div class="scale" ${id ? `id="${id}"` : ""} data-level="${level}"><div class="ticks" aria-hidden="true">${Array.from({ length: N }, (_, i) => `<i class="${i < on ? "on" : ""}"></i>`).join("")}</div>${limit != null ? `<i class="lim" style="left:${limit}%"></i><span class="limt" style="left:${limit}%">上限 ${limit}%</span>` : ""}</div>`;
}
function carSvg() {
  // 俯视示意图：车头向上。窗用侧边线段表示，状态用颜色。
  return `<svg class="car" width="300" height="286" viewBox="0 0 300 286" role="img" aria-label="车辆示意图：左后车窗未关，车已上锁" fill="none" stroke="currentColor" style="color:var(--ink)">
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="90" y="52" width="9" height="32" rx="3.5" fill="var(--ink3)" stroke="none" opacity=".55"/>
    <rect x="201" y="52" width="9" height="32" rx="3.5" fill="var(--ink3)" stroke="none" opacity=".55"/>
    <rect x="90" y="200" width="9" height="32" rx="3.5" fill="var(--ink3)" stroke="none" opacity=".55"/>
    <rect x="201" y="200" width="9" height="32" rx="3.5" fill="var(--ink3)" stroke="none" opacity=".55"/>
    <path d="M150 8c33 0 48 20 50 54l3 54v54c0 40-12 72-53 74-41-2-53-34-53-74v-54l3-54c2-34 17-54 50-54z" fill="var(--card2)" stroke-width="1.6"/>
    <path d="M115 66c8-8 62-8 70 0l-5 34h-60z" stroke-width="1.4" fill="var(--card)"/>
    <rect x="116" y="108" width="68" height="76" rx="12" stroke-width="1.4" fill="var(--card)"/>
    <path d="M118 194h64l5 20c-14 7-60 7-74 0z" stroke-width="1.4" fill="var(--card)"/>
    <path d="M104 150h12M184 150h12" stroke-width="1.2" opacity=".5"/>
    <path d="M104 108h12M184 108h12" stroke-width="1.2" opacity=".5"/>
  </g>
  <g stroke-linecap="round" stroke-width="4.5">
    <path d="M102 112v34" stroke="var(--ink3)"/><path d="M198 112v34" stroke="var(--ink3)"/>
    <path d="M198 154v34" stroke="var(--ink3)"/>
    <path d="M102 154v34" stroke="var(--bad)"/>
  </g>
  <path d="M96 171H58" stroke="var(--bad)" stroke-width="1.4"/><circle cx="96" cy="171" r="3" fill="var(--bad)" stroke="none"/>
  <text x="54" y="167" text-anchor="end" fill="var(--bad)" stroke="none" font-size="13" font-weight="600" font-family="-apple-system, PingFang SC, sans-serif">左后车窗</text>
  <text x="54" y="184" text-anchor="end" fill="var(--bad)" stroke="none" font-size="13" font-weight="600" font-family="-apple-system, PingFang SC, sans-serif">未关</text>
  <path d="M204 131h30" stroke="var(--ink3)" stroke-width="1.2"/><circle cx="204" cy="131" r="2.5" fill="var(--ink3)" stroke="none"/>
  <g transform="translate(236 119)" stroke="var(--ok)" stroke-width="1.8"><rect x="2" y="9" width="14" height="10" rx="2.5"/><path d="M5 9V6.5a4 4 0 0 1 8 0V9"/></g>
  <text x="256" y="148" fill="var(--ok)" stroke="none" font-size="13" font-weight="600" font-family="-apple-system, PingFang SC, sans-serif">已锁</text>
</svg>`;

    root.querySelector("#limv").textContent = v + "%";
  });
}
function render(scheme) {
  destroy3D();
  document.getElementById("phones").innerHTML = PAGES.map(([k, label, fn]) => `<figure class="cell"><div class="phone"><div class="screen" data-scheme="${scheme}">${status()}<div class="scroll">${fn()}</div>${tabs(k)}</div></div><figcaption>${label}</figcaption></figure>`).join("");
  bindRange(document);
  init3D();
  document.querySelectorAll("button[data-scheme]").forEach(b => b.setAttribute("aria-pressed", b.dataset.scheme === scheme));
  try { localStorage.setItem("ui-scheme", scheme); } catch (e) {}
}
document.querySelectorAll("button[data-scheme]").forEach(b => b.addEventListener("click", () => render(b.dataset.scheme)));
let start = "light";
try { const s = localStorage.getItem("ui-scheme"); if (s === "dark" || s === "light") start = s; } catch (e) {}
render(start);
</script>
</body>
</html>
